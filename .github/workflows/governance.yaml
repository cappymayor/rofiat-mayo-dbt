name: Check Marts Staging References

on:
  pull_request:
    paths:
      - 'dbt_proj/models/marts/**/*.sql'

jobs:
  check-staging-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so git diff works correctly against base branch

      - name: Check Modified SQL Files in Marts
        id: check_files
        run: |
          # Target directory
          TARGET_DIR="dbt_proj/models/marts"
          
          # Get list of Added (A) or Modified (M) SQL files in the PR within the target directory
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD | grep "^${TARGET_DIR}/.*\.sql$" || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No modified SQL files found in ${TARGET_DIR}."
            exit 0
          fi

          echo "Checking modified files:"
          echo "$CHANGED_FILES"
          echo "----------------------------------------"

          INVALID_FOUND=0

          # Case-insensitive regex check for ref('stg_ or ref('staging_
          # Matches pattern: ref( followed by quotes/spaces and stg_ or staging_
          REGEX="ref\(['\"][[:space:]]*(stg_|staging_)"

          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              # Search case-insensitively and print matching line numbers
              MATCHES=$(grep -Ein "$REGEX" "$FILE" || true)
              
              if [ -n "$MATCHES" ]; then
                echo "❌ Illegal staging reference found in: $FILE"
                echo "$MATCHES"
                echo ""
                INVALID_FOUND=1
              fi
            fi
          done

          if [ $INVALID_FOUND -eq 1 ]; then
            echo "::error::Direct staging references (ref('stg_*') or ref('staging_*')) are not allowed in marts models. Please reference intermediate or entity models instead."
            exit 1
          else
            echo "✅ All modified marts models passed staging reference checks!"
          fi