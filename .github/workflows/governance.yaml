name: Check Marts Staging References

on:
  pull_request:
    paths:
      - 'dbt_proj/models/marts/**/*.sql'

jobs:
  check-staging-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so git diff works correctly against base branch

      - name: Check Modified SQL Files in Marts
        id: check_files
        run: |
          # Target directory
          TARGET_DIR="dbt_proj/models/marts"
          
          # Get list of Added (A) or Modified (M) SQL files in the PR within the target directory
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD | grep "^${TARGET_DIR}/.*\.sql$" || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No modified SQL files found in ${TARGET_DIR}."
            exit 0
          fi

          echo "Checking modified files:"
          echo "$CHANGED_FILES"
          echo "----------------------------------------"

          INVALID_FOUND=0

          # Case-insensitive Extended Regex (-E):
          # 1) ref('stg_...', ref('staging_...', or ref('staging...)
          # 2) Direct table references: FROM staging_..., JOIN staging_..., FROM stg_..., JOIN stg_...
          # 3) Standalone staging table names after FROM/JOIN: FROM staging, JOIN staging
          REGEX="(ref\(['\"][[:space:]]*(stg_|staging_|staging(['\"_[:alnum:]]|$)))|((from|join)[[:space:]]+([[:alnum:]_]+\.)*(stg_|staging_|staging([[:space:]\"';]|$)|\"stg_|\"staging_))"

          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              # Search case-insensitively using Extended Regular Expressions (-E)
              MATCHES=$(grep -Ein -E "$REGEX" "$FILE" || true)
              
              if [ -n "$MATCHES" ]; then
                echo "❌ Illegal staging reference found in: $FILE"
                echo "$MATCHES"
                echo ""
                INVALID_FOUND=1
              fi
            fi
          done

          if [ $INVALID_FOUND -eq 1 ]; then
            echo "::error::Direct staging references (ref() or direct 'FROM/JOIN staging_' table references) are not allowed in marts models. Please reference intermediate or entity models instead."
            exit 1
          else
            echo "✅ All modified marts models passed staging reference checks!"
          fi